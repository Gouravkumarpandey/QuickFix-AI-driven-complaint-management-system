# Local deployment smoke environment. Put real deployment values in a private .env file.
services:
  mongo:
    image: mongo:7
    command: [mongod, --replSet, rs0, --bind_ip_all]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand({ping:1}).ok"]
      interval: 5s
      retries: 20
  mongo-init:
    image: mongo:7
    depends_on:
      mongo: {condition: service_healthy}
    entrypoint: [mongosh, --host, mongo:27017, --quiet, --eval]
    command: ["try {rs.status()} catch(e) {rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]})}"]
  clamav:
    image: clamav/clamav:stable
    volumes: [clamav-data:/var/lib/clamav]
    healthcheck:
      test: [CMD, clamdcheck.sh]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 10
  api:
    build: {context: ../backend, dockerfile: Dockerfile.helpdesk}
    env_file: .env
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/quickfix?replicaSet=rs0
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      PRIVATE_UPLOAD_DIR: /var/lib/quickfix/private
    ports: ["127.0.0.1:5000:5000"]
    volumes: [private-files:/var/lib/quickfix/private]
    depends_on:
      mongo-init: {condition: service_completed_successfully}
      clamav: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:5000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 60s
      retries: 5
  worker:
    build: {context: ../backend, dockerfile: Dockerfile.helpdesk}
    command: [node, worker/helpdeskWorker.js]
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/quickfix?replicaSet=rs0
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      PRIVATE_UPLOAD_DIR: /var/lib/quickfix/private
    volumes: [private-files:/var/lib/quickfix/private]
    depends_on:
      mongo-init: {condition: service_completed_successfully}
      clamav: {condition: service_healthy}
    restart: unless-stopped
  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile.helpdesk
      args:
        VITE_API_BASE_URL: /api
        VITE_SOCKET_SERVER_URL: http://localhost:5000
    ports: ["127.0.0.1:8080:80"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  mongo-data:
  private-files:
  clamav-data:
